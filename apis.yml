aid: nexthop-systems
name: Nexthop Systems
description: 'Nexthop AI (Nexthop Systems) builds power-efficient AI networking infrastructure
  for hyperscalers and NeoClouds — scale-out and scale-across Ethernet switches, a
  networking software portfolio, and optics and cables engineered to lower the cost
  per token of training and serving large AI models. Founded and led by CEO Anshul
  Sadana, the company is backed by Battery Ventures and raised an oversubscribed $500M
  Series B in 2025 at a $4.2 billion valuation. Nexthop runs a public marketing, blog
  and news site plus a login-gated customer Support Hub and Learning Hub; it does not
  currently publish a public developer API, OpenAPI specification, or SDK surface.'
